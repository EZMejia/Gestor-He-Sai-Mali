{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador - Mesa #{{ mesa_id }}</title>
    <link rel="icon" type="image/png" href="{% static 'He_Sai_Mali/logo.png' %}">
    
    <style>
        :root {
            /* Colores del diseño de la APP (He Sai Mali) */
            --primary-color: #981a28; /* Rojo Oscuro (Header) */
            --secondary-color: #f3bb67; /* Amarillo (Acento/Border) */
            --sidebar-bg: #2b3543; /* Gris Oscuro (Usado para el menú lateral) */
            --bg-page: #2c3038; /* Gris Oscuro (Fondo de página) */
            --text-light: #ffffff;
            --text-accent: #dacfb7;
            --menu-item-hover: #b12131; /* Rojo más claro para hover */
        }

        /* Estilos generales y del body */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            display: flex;
            min-height: 100dvh;
            user-select: none;
        }

        /* Estilos del Contenedor Principal (Layout) */
        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        #app::before {
            content: '';
            position: fixed; /* Ocupa toda la ventana y se mantiene fijo */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* Aplicamos la imagen de fondo y el filtro aquí */
            background-image: url("{% static 'He_Sai_Mali/fondo.png' %}");
            background-position: center bottom;
            background-size: cover;
            background-attachment: fixed;
            
            /* APLICACIÓN DEL FILTRO SOLO A LA IMAGEN DE FONDO */
            filter: grayscale(100%) brightness(110%); 
            
            z-index: -1; /* Manda la imagen al fondo, detrás de todo el contenido */
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            background-color: var(--primary-color);
            border-bottom: 8px solid var(--primary-color);
            color: var(--text-light);
            padding: 30px 15px;
            box-shadow: 0 6px 10px black;
            position: fixed;
            width: 100%;
            z-index: 1000;
        }

        .header-title {
            display: flex;
            align-items: center;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-accent);
        }
        .header-title img {
            height: 40px;
            margin-right: 10px;
        }

        /* Estilos generales del contenedor */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px;
            font-family: 'Roboto', sans-serif;
        }

        /* Contenedor del SVG (Círculo) */
        .circular-progress-bar {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px;
        }

        /* SVG Base y Barra de Progreso */
        .circular-progress-bar svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg); /* Inicia la barra desde arriba */
            overflow: visible; /* <--- Agrega esto para evitar recortes del pulso */
        }

        .circle-bg {
            fill: none;
            stroke: #eee; /* Color de fondo del círculo */
            stroke-width: 10;
        }

        .circle-progress {
            fill: none;
            stroke: green; /* Color de la barra de progreso (cambia por JS) */
            stroke-width: 10;
            stroke-linecap: round;
            /* La animación de la barra se controla por el atributo stroke-dashoffset */
            transition: stroke-dashoffset 1s linear; 
        }

        /* Texto del temporizador en el centro */
        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5em;
            font-weight: bold;
            color: var(--secondary-color);
        }
        
        /* Mensajes */
        .message {
            margin-top: 20px;
            font-size: 1.2em;
        }

        @keyframes svg-glow-success {
            0% { filter: drop-shadow(0 0 2px rgba(40, 167, 69, 0.4)); }
            50% { filter: drop-shadow(0 0 18px rgba(40, 167, 69, 1)); }
            100% { filter: drop-shadow(0 0 2px rgba(40, 167, 69, 0.4)); }
        }
        
        @keyframes svg-glow-danger {
            0% { filter: drop-shadow(0 0 2px rgba(220, 53, 69, 0.4)); }
            50% { filter: drop-shadow(0 0 18px rgba(220, 53, 69, 1)); }
            100% { filter: drop-shadow(0 0 2px rgba(220, 53, 69, 0.4)); }
        }

        .circle-pulse-success {
            animation: svg-glow-success 1.5s infinite;
        }

        .circle-pulse-danger {
            animation: svg-glow-danger 1.5s infinite;
        }

        a, img, i {
            -webkit-user-drag: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <header class="header">
                <h1 class="header-title">
                    <img src="{% static 'He_Sai_Mali/logo.png' %}" alt="Logo He Sai Mali">
                    Mesa #{{ mesa_id }}
                </h1>
            </header>
        <div class="timer-container" style="margin-top: 30px;">
            <div class="message">
                {% if has_active_pedido %}
                    <p style="color: white;">Tiempo restante para el servicio del pedido.</p>
                {% else %}
                    <p style="color: white;">Esperando nuevo pedido confirmado.</p>
                {% endif %}
            </div>
            
            <div class="circular-progress-bar">
                <svg viewBox="0 0 100 100">
                    <circle class="circle-bg" cx="50" cy="50" r="45"></circle>
                    <circle class="circle-progress" id="progress-circle" cx="50" cy="50" r="45"></circle>
                </svg>
                
                <div class="timer-text" id="timer-display">00:00</div>
            </div>

        </div>
    </div>

    <script>
        // --- Variables inyectadas por Django ---
        let remainingSeconds = parseInt("{{ remaining_seconds|default:0 }}");
        let totalSeconds = parseInt("{{ tiempo_total_segundos|default:0 }}");
        let currentFase = "{{ fase|default:'ANTES' }}";

        // --- Selectores del DOM exactos para tu HTML ---
        const timerDisplay = document.getElementById('timer-display');
        const progressCircle = document.getElementById('progress-circle');
        const statusMessage = document.querySelector('.message p'); 
        const timerCard = document.querySelector('.timer-container'); 

        let alertSoundPlayed = false;

        // Constantes para el cálculo del círculo
        const radius = 45;
        const circumference = 2 * Math.PI * radius;
        if (progressCircle) {
            progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        }

        // --- Función para formatear tiempo (MM:SS) ---
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) seconds = 0;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // --- Función para actualizar la barra circular ---
        function setProgress(percent) {
            if (!progressCircle) return;
            const offset = circumference - (percent / 100) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        // --- Generador de sonido nativo (UX Alertas) ---
        function playNotificationSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = type === 'success' ? 'sine' : 'triangle';
                oscillator.frequency.setValueAtTime(type === 'success' ? 880 : 380, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5); 
            } catch (e) {
                console.log("Audio de alerta bloqueado temporalmente por el navegador.");
            }
        }

        // --- Renderizador de la interfaz gráfica ---
        function renderUI() {
            // Removemos los pulsos anteriores del círculo en cada ciclo
            progressCircle?.classList.remove('circle-pulse-success', 'circle-pulse-danger');

            if (currentFase === 'ANTES') {
                if (statusMessage) statusMessage.textContent = "Esperando nuevo pedido confirmado.";
                if (timerDisplay) timerDisplay.textContent = "00:00";
                setProgress(0);
                if (progressCircle) progressCircle.style.stroke = 'red';
                alertSoundPlayed = false;
            } 
            else if (currentFase === 'SERVIDO') {
                if (statusMessage) statusMessage.textContent = "¡Pedido completado con éxito! Despachando comida.";
                
                // Agregamos el pulso al CÍRCULO
                progressCircle?.classList.add('circle-pulse-success');
                if (progressCircle) progressCircle.style.stroke = '#28a745'; 
                
                if (timerDisplay) timerDisplay.textContent = "LISTO";
                setProgress(100); 

                if (!alertSoundPlayed) {
                    playNotificationSound('success');
                    alertSoundPlayed = true;
                }
            } 
            else if (currentFase === 'COMPLETADO') {
                if (statusMessage) statusMessage.textContent = "¡Tiempo límite agotado! Pedido retrasado.";
                
                // Agregamos el pulso al CÍRCULO
                progressCircle?.classList.add('circle-pulse-danger');
                if (progressCircle) progressCircle.style.stroke = '#dc3545';
                
                if (timerDisplay) timerDisplay.textContent = "00:00";
                
                // SOLUCIÓN: Cambiar de 0 a 100 para que el círculo rojo esté visible
                // y el drop-shadow tenga un elemento sobre el cual proyectarse.
                setProgress(100); 

                if (!alertSoundPlayed) {
                    playNotificationSound('danger');
                    alertSoundPlayed = true;
                }
            }
            else { 
                // FASE: DURANTE
                if (statusMessage) statusMessage.textContent = "Tiempo restante para el servicio del pedido.";
                if (timerDisplay) timerDisplay.textContent = formatTime(remainingSeconds);
                
                const percent = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
                setProgress(percent);
                
                if (progressCircle) {
                    if (remainingSeconds <= 30) {
                        progressCircle.style.stroke = 'orange';
                    } else {
                        progressCircle.style.stroke = 'green';
                    }
                }
                alertSoundPlayed = false;
            }
        }

        // 1. Cuenta regresiva local fluida en el cliente (Cada 1 segundo)
        setInterval(() => {
            // EL CAMBIO: Solo resta segundos a la vista SI la fase es "DURANTE"
            if (remainingSeconds > 0 && currentFase === 'DURANTE') {
                remainingSeconds--;
                renderUI();
            }
        }, 1000);

        // 2. Polling asíncrono (Sincroniza con el servidor cada 4 segundos)
        function fetchServerSync() {
            fetch('?format=json')
                .then(response => {
                    if (!response.ok) throw new Error("Error en la respuesta de red");
                    return response.json();
                })
                .then(data => {
                    remainingSeconds = data.remaining_seconds;
                    totalSeconds = data.tiempo_total_segundos;
                    
                    if (currentFase !== data.fase) {
                        currentFase = data.fase;
                        if (['ANTES', 'SERVIDO', 'COMPLETADO'].includes(currentFase)) {
                            alertSoundPlayed = false;
                        }
                    }
                    // Aunque se actualice el contador interno, la vista renderizará "LISTO"
                    renderUI();
                })
                .catch(error => console.error("Sincronización silenciosa en espera:", error.message));
        }

        setInterval(fetchServerSync, 4000);
        renderUI();
    </script>
</body>
</html>
