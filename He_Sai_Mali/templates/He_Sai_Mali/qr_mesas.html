{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'He_Sai_Mali/logo.png' %}">
    <title>Códigos QR de Mesas (Temporizador)</title>
    
    <!-- styles.css -->
    <link rel="stylesheet" href="{% static 'He_Sai_Mali/css/styles.css' %}">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            min-height: 100vh;
            user-select: none;
            background-color: var(--bg-page);
        }

        #app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
        }

        #app::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("{% static 'He_Sai_Mali/fondo.png' %}");
            background-position: center bottom;
            background-size: cover;
            background-attachment: fixed;
            filter: grayscale(100%) brightness(110%); 
            z-index: -1; 
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 0 20px;
            box-shadow: 0 6px 10px black;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .header-title {
            display: flex;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-title img {
            height: 35px;
            width: auto;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        /* Contenedor principal ajustado para no ser tapado por el header */
        .qr-list-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-top: 70px;
            width: 100%;
        }

        .qr-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1200px;
        }
        
        /* Estilos de las tarjetas ajustados para pantallas chicas */
        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            background-color: #3f444d; 
            color: var(--text-light);
            border: 2px solid var(--secondary-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px; /* Controla el ancho máximo en pantallas grandes */
        }

        .qr-image {
            max-height: 55vh; 
            max-width: 100%;
            width: auto;
            height: auto;
            border-radius: 10px;
            object-fit: contain; 
            background-color: #fff; /* Asegura fondo blanco por si la imagen QR es transparente */
            padding: 10px;
        }

        .qr-container p {
            margin-top: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        a, img, i {
            -webkit-user-drag: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* --- MEDIA QUERIES PARA PANTALLAS PEQUEÑAS --- */
        @media (max-width: 576px) {
            .header-title {
                font-size: 1rem;
            }
            
            .header-title img {
                height: 28px;
            }

            .qr-container {
                padding: 15px;
            }

            .qr-image {
                max-height: 45vh;
            }

            .qr-container p {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <header class="header">
            <h1 class="header-title">
                <img src="{% static 'He_Sai_Mali/logo.png' %}" alt="Logo He Sai Mali">
                {% if titulo %}{{ titulo }}{% endif %}
            </h1>
        </header>
        
        <main class="qr-list-container">
            <div class="qr-grid">
                {% for mesa in mesas %}
                    <div class="qr-container">
                        <img src="{{ mesa.qr_data }}" alt="QR Code Mesa {{ mesa.idMesa }}" class="qr-image">
                        <p style="color: white;">Escanea para verificar el estado del servicio.</p>
                    </div>
                {% endfor %}
            </div>
        </main>
    </div>
</body>
</html>
