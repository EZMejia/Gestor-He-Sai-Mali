{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>He Sai Mali - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="{% static 'He_Sai_Mali/logo.png' %}">

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    
    <!-- Bootstrap y Awesome Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- styles.css -->
    <link rel="stylesheet" href="{% static 'He_Sai_Mali/css/styles.css' %}">
</head>

<body class="fondo-imagen container-fluid d-flex justify-content-center align-items-center" style="min-height: 100dvh;">
    <div class="row rounded overflow-hidden col-11 col-md-9 col-lg-8 shadow-lg">
        <!-- Columna del formulario -->
        <form method="post" action="{% url 'api_login' %}" class="bg-claro p-5 d-flex flex-column col-12 col-lg-7">
            {% csrf_token %}
            <!-- Boton de regreso y titulo -->
            <div class="row">
                <div class="col-4 d-flex align-items-center">
                    <a href="/">
                        <i class="fa-solid fa-arrow-left flechaRegresar fs-3"></i>
                    </a>
                </div>
                <div class="col-8 d-flex flex-row align-items-center justify-content-end d-lg-none">
                    <img src="{% static 'He_Sai_Mali/logo.png' %}" class="logo" alt="Logo He Sai Mali">
                    <span class="fw-bold m-2 text-rojo">He Sai Mali</span>
                </div>
            </div>
            <h3 class="mt-4 text-center" style="color: var(--texto-oscuro)">Iniciar Sesión</h3>

            <!-- Zona de mensajes -->
            <div id="error-container">
                {% if messages %} {% for message in messages %}
                    <p class="alert alert-danger py-2">{{ message }}</p>
                {% endfor %} {% endif %}
            </div>

            <!-- Inputs -->
            <div class="form-floating input-diseno-imagen mb-3">
                <i class="fa-solid fa-user input-icon"></i>
                
                <input type="text" class="form-control" name="usuario" id="usuario" placeholder="Usuario" autocomplete="off" required>
                <label for="usuario">Usuario</label>
            </div>

            <div class="form-floating input-diseno-imagen mb-2">
                <i class="fa-solid fa-lock input-icon"></i>
                
                <input type="password" class="form-control" name="contrasena" id="contrasena" placeholder="••••••••" autocomplete="off" required>
                <label for="contrasena">Contraseña</label>
            </div>

            <!-- Seccion de recordar y recuperar contraseña -->
            <div class="row mt-4 mb-3 mx-1">
                <div class="col-12 col-lg-6 d-flex align-items-center">
                    <input type="checkbox" name="recordar" id="recordar" value="" style="accent-color: var(--primary-color); width: 1.2rem; height: 1.2rem;">
                    <label class="texto-gris ms-1" style="font-size: 0.9em;" for="recordar">
                        Recordarme                        
                    </label>
                </div>
                <div class="col-12 col-lg-6 mt-4 mt-lg-0 d-flex align-items-center justify-content-center justify-content-lg-end">
                    <a href="{% url 'recuperar_password' %}" class="texto-gris link" style="font-size: 0.9em; text-decoration: none;">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
            </div>

            <!-- Boton iniciar sesion -->
            <div class="row d-flex justify-content-center">
                <button type="submit" class="btn-menu">Iniciar sesión</button>
            </div>
        </form>

        <!-- Columna de imagen -->
        <div class="col-lg-5 bg-gradiente-rojo d-none d-lg-flex align-items-center justify-content-center p-1">
            <img src="{% static 'He_Sai_Mali/logo.png' %}" 
                class="img-fluid" 
                style="min-height: 250px; object-fit: contain;" 
                alt="Logo He Sai Mali">
        </div>
    </div>

    <script>
        document.querySelector("form").addEventListener("submit", function (e) {
            e.preventDefault(); // Detiene la recarga tradicional

            const formData = new FormData(this);
            const data = {
                usuario: formData.get("usuario"),
                contrasena: formData.get("contrasena"),
                recordar: document.getElementById("recordar").checked
            };

            const errorContainer = document.getElementById("error-container");
            errorContainer.innerHTML = ""; // Limpia errores previos

            fetch("{% url 'api_login' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}" 
                },
                body: JSON.stringify(data),
            })
                .then((response) => {
                return response.json().then((json) => {
                    if (!response.ok) {
                    // Si hay un error de validación de campos, se extrae el texto del mensaje
                    let errorMsg = json.error;
                    if (typeof json.error === "object") {
                        errorMsg = Object.values(json.error).flat().join(" ");
                    }
                    throw new Error(
                        errorMsg || "Ocurrió un error al intentar iniciar sesión.",
                    );
                    }
                    return json;
                });
                })
                .then((res) => {
                if (res.success && res.redirect_url) {
                    window.location.href = res.redirect_url; // Redirige según mande el API
                }
                })
                .catch((error) => {
                errorContainer.innerHTML = `<p class="alert alert-danger py-2">${error.message}</p>`;
                });
        });
    </script>
</body>
</html>
