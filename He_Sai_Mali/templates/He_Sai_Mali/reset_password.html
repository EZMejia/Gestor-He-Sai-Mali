{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{% static 'He_Sai_Mali/logo.png' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>He Sai Mali - Nueva Contraseña</title>
    <style>
        body { font-family: 'Roboto', sans-serif; background-image: url("{% static 'He_Sai_Mali/fondo.png' %}"); background-position: center bottom; display: flex; justify-content: center; align-items: flex-start; min-height: 100dvh; margin: 0; user-select: none; }
        form { display: block; margin: 100px auto; padding: 40px; background-color: white; box-shadow: 0 0 50px 10px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; border-radius: 5px; box-sizing: border-box;}
        .He_Sai_Mali { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 20px; }
        .He_Sai_Mali .logo { height: 40px; margin-right: 10px; }
        .He_Sai_Mali h2 { margin: 0; font-size: large; color: #981a28; }
        input { width: 100%; padding: 8px; margin: 10px 0 20px 0; border-width: 0 0 2px 0; border-style: solid; border-color: #ccc; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-bottom-color: #981a28; }
        .botones { display: flex; justify-content: flex-end; margin-top: 10px;}
        .Continuar { padding: 10px 20px; background-color: #981a28; color: white; border: 2px solid #f3bb67; border-radius: 5px; cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold; font-size: 1.05em;}
        .Continuar:hover { background-color: #832630; }
        .alert { padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; font-size: 0.9em;}
        .alert-error { background-color: #ffeaea; color: red; border: 1px solid red; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        label { font-size: 0.9em; font-weight: bold; color: #444;}
        .help-text { font-size: 0.8em; color: #666; margin-top: -15px; margin-bottom: 15px; display: block; line-height: 1.3;}
        
        /* Ajuste para celulares */
        @media (max-width: 600px) {
            form { margin: 40px 15px; padding: 30px 20px; }
            .He_Sai_Mali h2 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <form id="resetForm">
        <div class="He_Sai_Mali">
            <img src="{% static 'He_Sai_Mali/logo.png' %}" class="logo" alt="Logo">
            <h2>He Sai Mali</h2>
        </div>

        <h3 style="margin-top: 0; color: #333; text-align: center;">Crear Nueva Contraseña</h3>
        
        <div id="alert-box" class="alert"></div>

        <input type="hidden" id="uid" value="{{ uidb64 }}">
        <input type="hidden" id="token" value="{{ token }}">

        <label>Nueva contraseña:</label>
        <input type="password" id="pass1" placeholder="••••••••" required autocomplete="off">
        <span class="help-text">Mínimo 10 caracteres, incluir una mayúscula, una minúscula, un número y un símbolo.</span>
        
        <label>Confirmar contraseña:</label>
        <input type="password" id="pass2" placeholder="••••••••" required autocomplete="off">
        
        <div class="botones">
            <button type="submit" class="Continuar" id="btn-enviar">Guardar e Iniciar Sesión</button>
        </div>
    </form>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass1 = document.getElementById('pass1').value;
            const pass2 = document.getElementById('pass2').value;
            const btn = document.getElementById('btn-enviar');
            const alertBox = document.getElementById('alert-box');
            
            alertBox.style.display = 'none';

            // Validación Frontend: 10 chars, upper, lower, num, symbol
            const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{10,}$/;
            if (!passRegex.test(pass1)) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.innerHTML = `<b>Error:</b> La contraseña no cumple con los requisitos mínimos de seguridad.`;
                return;
            }

            if(pass1 !== pass2) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.textContent = "Las contraseñas no coinciden.";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Guardando...";

            try {
                const res = await fetch('/api/restablecer-password/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        uid: document.getElementById('uid').value,
                        token: document.getElementById('token').value,
                        password: pass1
                    })
                });
                const data = await res.json();

                alertBox.style.display = 'block';
                if (res.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerHTML = `<b>¡Éxito!</b> ${data.message}`;
                    setTimeout(() => window.location.href = '/login/', 2500); 
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.innerHTML = `<b>Error:</b> ${data.error}`;
                    btn.disabled = false;
                    btn.textContent = "Guardar e Iniciar Sesión";
                }
            } catch (error) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.textContent = "Error de conexión con el servidor.";
                btn.disabled = false;
                btn.textContent = "Guardar e Iniciar Sesión";
            }
        });
    </script>
</body>
</html>
