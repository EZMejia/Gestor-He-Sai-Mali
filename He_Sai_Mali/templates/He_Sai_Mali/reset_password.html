<body class="fondo-imagen container-fluid d-flex justify-content-center align-items-center" style="min-height: 100dvh;">
    <form id="resetForm" class="rounded bg-claro overflow-hidden col-11 shadow-lg d-flex flex-column py-5" style="max-width: 500px;">
        <!-- Titulo -->
        <div class="col-12 d-flex flex-row align-items-center justify-content-center">
            <img src="{% static 'He_Sai_Mali/logo.png' %}" class="logo" alt="Logo He Sai Mali">
            <span class="fw-bold m-2 text-rojo fs-5">He Sai Mali</span>
        </div>
        <h3 class="mt-4 text-center mx-4" style="color: var(--texto-oscuro)">Crear Nueva Contraseña</h3>

        <!-- Zona de mensajes -->
        <div id="alert-box" class="alert mx-5 d-none"></div>

        <input type="hidden" id="uid" value="{{ uidb64 }}">
        <input type="hidden" id="token" value="{{ token }}">

        <!-- Inputs -->
        <div class="form-floating input-diseno-imagen mx-5 mt-3">
            <i class="fa-solid fa-lock input-icon"></i>
            
            <input type="password" class="form-control" name="pass1" id="pass1" placeholder="••••••••" autocomplete="off" required>
            <label for="pass1">Nueva contraseña</label>
        </div>
        <span class="texto-gris mx-5 mb-3" style="font-size: 0.9em;">Mínimo 10 caracteres, incluir una mayúscula, una minúscula, un número y un símbolo.</span>

        <div class="form-floating input-diseno-imagen mb-4 mx-5">
            <i class="fa-solid fa-lock input-icon"></i>
            
            <input type="password" class="form-control" name="pass2" id="pass2" placeholder="••••••••" autocomplete="off" required>
            <label for="pass2">Confirmar contraseña</label>
        </div>

        <!-- Boton para recuperar contraseña -->
        <div class="row d-flex justify-content-center mx-5">
            <button type="submit" class="btn-menu" id="btn-enviar">Guardar e Iniciar Sesión</button>
        </div>
    </form>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass1 = document.getElementById('pass1').value;
            const pass2 = document.getElementById('pass2').value;
            const btn = document.getElementById('btn-enviar');
            const alertBox = document.getElementById('alert-box');
            
            alertBox.style.display = 'none';

            // Validación Frontend: 10 chars, upper, lower, num, symbol
            const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{10,}$/;
            if (!passRegex.test(pass1)) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-danger mx-5 mb-0 mt-2';
                alertBox.innerHTML = `<b>Error:</b> La contraseña no cumple con los requisitos mínimos de seguridad.`;
                return;
            }

            if(pass1 !== pass2) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-danger mx-5 mb-0 mt-2';
                alertBox.textContent = "Las contraseñas no coinciden.";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Guardando...";

            try {
                const res = await fetch('/api/restablecer-password/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        uid: document.getElementById('uid').value,
                        token: document.getElementById('token').value,
                        password: pass1
                    })
                });
                const data = await res.json();

                alertBox.style.display = 'block';
                if (res.ok) {
                    alertBox.className = 'alert alert-success mx-5 mb-0 mt-2';
                    alertBox.innerHTML = `<b>¡Éxito!</b> ${data.message}`;
                    setTimeout(() => window.location.href = '/login/', 2500); 
                } else {
                    alertBox.className = 'alert alert-danger mx-5 mb-0 mt-2';
                    alertBox.innerHTML = `<b>Error:</b> ${data.error}`;
                    btn.disabled = false;
                    btn.textContent = "Guardar e Iniciar Sesión";
                }
            } catch (error) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-danger mx-5 mb-0 mt-2';
                alertBox.textContent = "Error de conexión con el servidor.";
                btn.disabled = false;
                btn.textContent = "Guardar e Iniciar Sesión";
            }
        });
    </script>
</body>
