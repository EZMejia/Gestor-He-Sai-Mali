{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>He Sai Mali - Recuperar Contraseña</title>
    <link rel="icon" type="image/png" href="{% static 'He_Sai_Mali/logo.png' %}">

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    
    <!-- Bootstrap y Awesome Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- styles.css -->
    <link rel="stylesheet" href="{% static 'He_Sai_Mali/css/styles.css' %}">
</head>

<body class="fondo-imagen container-fluid d-flex justify-content-center align-items-center" style="min-height: 100dvh;">
    <form id="recoverForm" class="rounded bg-claro overflow-hidden col-11 shadow-lg d-flex flex-column py-5" style="max-width: 500px;">
        <!-- Boton de regreso y titulo -->
        <div class="row ms-5 me-4">
            <div class="col-4 d-flex align-items-center">
                <a href="{% url 'login' %}">
                    <i class="fa-solid fa-arrow-left flechaRegresar fs-3"></i>
                </a>
            </div>
            <div class="col-8 d-flex flex-row align-items-center justify-content-end">
                <img src="{% static 'He_Sai_Mali/logo.png' %}" class="logo" alt="Logo He Sai Mali">
                <span class="fw-bold m-2 text-rojo">He Sai Mali</span>
            </div>
        </div>
        <h3 class="mt-4 text-center mx-4" style="color: var(--texto-oscuro)">Recuperar Contraseña</h3>
        <span class="texto-gris text-center mx-5" style="font-size: 0.9em;">Ingresa el correo electrónico asociado a tu cuenta. Te enviaremos un enlace seguro para restablecerla.</span>

        <!-- Zona de mensajes -->
        <div id="alert-box" class="alert mx-5 d-none"></div>

        <!-- Input -->
        <div class="form-floating input-diseno-imagen my-3 mx-5">
            <i class="fa-solid fa-envelope input-icon"></i>
            
            <input type="email" class="form-control" name="correo" id="correo" placeholder="nombre@dominio.com" autocomplete="off" required>
            <label for="correo">Correo</label>
        </div>

        <!-- Boton para recuperar contraseña -->
        <div class="row d-flex justify-content-center mx-5">
            <button type="submit" class="btn-menu" id="btn-enviar">Enviar enlace de recuperación</button>
        </div>
    </form>

    <script>
        document.getElementById('recoverForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            const alertBox = document.getElementById('alert-box');
            const correo = document.getElementById('correo').value;
            
            // Validación Frontend: formato de correo correcto
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(correo)) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-danger mx-5 mb-0 mt-2';
                alertBox.innerHTML = `<b>Error:</b> Por favor ingresa un correo electrónico válido.`;
                return;
            }

            btn.disabled = true;
            btn.textContent = "Enviando correo...";
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/solicitar-recuperacion/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo: correo })
                });
                const data = await res.json();

                alertBox.style.display = 'block';
                if (res.ok) {
                    alertBox.className = 'alert alert-success mx-5 mb-0 mt-2';
                    alertBox.innerHTML = `<b>¡Éxito!</b> ${data.message}`;
                    document.getElementById('correo').value = '';
                } else {
                    alertBox.className = 'alert alert-danger mx-5 mb-0 mt-2';
                    alertBox.innerHTML = `<b>Error:</b> ${data.error}`;
                }
            } catch (error) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-danger mx-5 mb-0 mt-2';
                alertBox.textContent = "Error de conexión con el servidor.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Enviar enlace de recuperación";
            }
        });
    </script>
</body>
</html>
