{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{% static 'He_Sai_Mali/logo.png' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>He Sai Mali - Recuperar Contraseña</title>
    <style>
        body { font-family: 'Roboto', sans-serif; background-image: url("{% static 'He_Sai_Mali/fondo.png' %}"); background-position: center bottom; display: flex; justify-content: center; align-items: flex-start; min-height: 100dvh; margin: 0; user-select: none; }
        form { display: block; margin: 100px auto; padding: 40px; background-color: white; box-shadow: 0 0 50px 10px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; border-radius: 5px; box-sizing: border-box;}
        .He_Sai_Mali { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; }
        .He_Sai_Mali .logo-texto { display: flex; align-items: center; }
        .He_Sai_Mali .logo { height: 40px; margin-right: 10px; }
        .He_Sai_Mali h2 { margin: 0; font-size: large; color: #981a28; }
        .flechaRegresar { width: 25px; height: 25px; transform: rotate(180deg); filter: brightness(0) saturate(100%) invert(13%) sepia(97%) saturate(700%) hue-rotate(320deg) brightness(130%) contrast(100%); transition: 0.2s;}
        .flechaRegresar:hover { filter: brightness(0) saturate(100%) invert(13%) sepia(97%) saturate(700%) hue-rotate(320deg) brightness(90%) contrast(100%); }
        input { width: 100%; padding: 8px; margin: 15px 0; border-width: 0 0 2px 0; border-style: solid; border-color: #ccc; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-bottom-color: #981a28; }
        .botones { display: flex; justify-content: flex-end; margin-top: 20px;}
        .Continuar { padding: 10px 20px; background-color: #981a28; color: white; border: 2px solid #f3bb67; border-radius: 5px; cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold; font-size: 1.05em;}
        .Continuar:hover { background-color: #832630; }
        .alert { padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; font-size: 0.9em;}
        .alert-error { background-color: #ffeaea; color: red; border: 1px solid red; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        p.info-text { color: #666; font-size: 0.9em; text-align: justify; margin-bottom: 20px;}
        
        /* Ajuste para celulares */
        @media (max-width: 600px) {
            form { margin: 40px 15px; padding: 30px 20px; }
            .He_Sai_Mali h2 { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <form id="recoverForm">
        <div class="He_Sai_Mali">
            <a href="{% url 'login' %}">
                <img src="{% static 'He_Sai_Mali/flecha.png' %}" class="flechaRegresar" alt="regresar">
            </a>
            <div class="logo-texto">
                <img src="{% static 'He_Sai_Mali/logo.png' %}" class="logo" alt="Logo">
                <h2>He Sai Mali</h2>
            </div>
        </div>

        <h3 style="margin-top: 0; color: #333;">Recuperar Contraseña</h3>
        <p class="info-text">Ingresa el correo electrónico asociado a tu cuenta. Te enviaremos un enlace seguro para restablecerla.</p>

        <div id="alert-box" class="alert"></div>

        <input type="email" id="correo" placeholder="nombre@dominio.com" required autocomplete="off">
        
        <div class="botones">
            <button type="submit" class="Continuar" id="btn-enviar">Enviar enlace de recuperación</button>
        </div>
    </form>

    <script>
        document.getElementById('recoverForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            const alertBox = document.getElementById('alert-box');
            const correo = document.getElementById('correo').value;
            
            // Validación Frontend: formato de correo correcto
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(correo)) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.innerHTML = `<b>Error:</b> Por favor ingresa un correo electrónico válido.`;
                return;
            }

            btn.disabled = true;
            btn.textContent = "Enviando correo...";
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/solicitar-recuperacion/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo: correo })
                });
                const data = await res.json();

                alertBox.style.display = 'block';
                if (res.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerHTML = `<b>¡Éxito!</b> ${data.message}`;
                    document.getElementById('correo').value = '';
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.innerHTML = `<b>Error:</b> ${data.error}`;
                }
            } catch (error) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.textContent = "Error de conexión con el servidor.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Enviar enlace de recuperación";
            }
        });
    </script>
</body>
</html>
